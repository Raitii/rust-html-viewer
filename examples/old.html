<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>料金プラン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>料金プラン</h1>
    <p>あなたに合ったプランをお選びください。</p>
  </header>
  <main>
    <div class="card">
      <h2>ベーシック</h2>
      <p class="price">月額 980円</p>
      <ul>
        <li>ストレージ 10GB</li>
        <li>メールサポート</li>
      </ul>
    </div>
    <div class="card">
      <h2>スタンダード</h2>
      <p class="price">月額 1,980円</p>
      <ul>
        <li>ストレージ 100GB</li>
        <li>メールサポート</li>
        <li>チャットサポート</li>
      </ul>
    </div>
    <div class="card">
      <h2>旧プラン</h2>
      <p>このプランは新規受付を終了しました。</p>
    </div>
    <p>お問い合わせは support@example.com まで。</p>
  </main>
</body>
</html>
