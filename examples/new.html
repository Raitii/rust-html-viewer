<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>料金プラン</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description" content="料金プラン一覧">
</head>
<body>
  <header>
    <h1>料金プラン</h1>
    <p>あなたに合ったプランをお選びください。</p>
  </header>
  <main>
    <div class="card">
      <h2>ベーシック</h2>
      <p class="price">月額 1,080円</p>
      <ul>
        <li>ストレージ 20GB</li>
        <li>メールサポート</li>
      </ul>
    </div>
    <div class="card">
      <h2>スタンダード <span class="badge">人気</span></h2>
      <p class="price">月額 1,980円</p>
      <ul>
        <li>ストレージ 100GB</li>
        <li>メールサポート</li>
        <li>チャットサポート</li>
      </ul>
    </div>
    <div class="card">
      <h2>プロ</h2>
      <p class="price">月額 4,980円</p>
      <ul>
        <li>ストレージ 1TB</li>
        <li>優先サポート</li>
      </ul>
    </div>
    <p>お問い合わせは support@example.com まで。</p>
  </main>
</body>
</html>
